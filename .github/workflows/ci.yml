name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22          # workflow dry-run harness (tests/wf_harness.mjs)
      - name: Install
        run: uv sync --locked
      - name: Doctor
        run: bin/stack doctor
      - name: Stack tests
        run: uv run python -m unittest discover -s tests
      - name: Image MCP server tests
        run: uv run pytest stack_mcp -q
